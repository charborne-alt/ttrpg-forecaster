name: Daily TTRPG Lead Fetcher

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Market Leads & Cross-Match
        run: |
          cat << 'EOF' > fetch_leads.py
          import requests
          from bs4 import BeautifulSoup
          import json
          from datetime import datetime

          leads = []
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # 1. SCRAPE COMPETITOR: Bundle of Holding
          try:
              r_boh = requests.get('https://bundleofholding.com/', headers=headers, timeout=15)
              if r_boh.status_code == 200:
                  soup = BeautifulSoup(r_boh.text, 'html.parser')
                  active_bundles = set()
                  for link in soup.find_all('a', href=True):
                      if '/presents/' in link['href']:
                          name = link.text.strip()
                          if name and len(name) > 3 and name.lower() not in ['past offers', 'all offers']:
                              active_bundles.add(name)
                  
                  for idx, bundle_name in enumerate(list(active_bundles)[:3]):
                      leads.append({
                          "source": "Bundle of Holding",
                          "title": f"Live Competitor: {bundle_name}",
                          "metric": "Active Competitor",
                          "tier": "t2"
                      })
          except Exception as e:
              print("Bundle of Holding Fetch Error:", e)

          # 2. SCRAPE KICKSTARTER (Tabletop Games)
          try:
              r_ks = requests.get('https://www.kickstarter.com/projects/feed/category/tabletop%20games?format=json', headers=headers, timeout=15)
              if r_ks.status_code == 200:
                 ks_data = r_ks.json()
                 for project in ks_data.get("projects", [])[:3]:
                     leads.append({
                          "source": "Kickstarter",
                          "title": f"KS Lead: {project.get('name', 'Unknown Project')}",
                          "metric": "Trending Campaign",
                          "tier": "t1"
                      })
          except Exception as e:
              print("Kickstarter Fetch Error:", e)

          # 3. FETCH RETAIL LEADS: DriveThruRPG
          try:
              gateway_url = "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.drivethrurpg.com%2Frss.php"
              r_dtrpg = requests.get(gateway_url, timeout=15)
              if r_dtrpg.status_code == 200:
                  data = r_dtrpg.json()
                  if data.get("status") == "ok":
                      for idx, item in enumerate(data.get("items", [])[:8]):
                          title = item.get("title", "").strip()
                          leads.append({
                              "source": "DriveThruRPG",
                              "title": f"DTRPG #{idx+1}: {title}",
                              "metric": "DriveThru Bestseller",
                              "tier": "t2"
                          })
          except Exception as e:
              print("DriveThruRPG Gateway Warning:", e)

          # Safety Fallback
          if not leads:
              leads = [
                  { "source": "Bundle of Holding", "title": "Live Competitor Bundle: Fantasy Campaign", "tier": "t2" },
                  { "source": "DriveThruRPG", "title": "DTRPG #1: Delta Green Cosmic Horror RPG Collection", "tier": "t1" }
              ]

          output = {
              "last_updated": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
              "leads": leads
          }

          with open('ttrpg_leads.json', 'w') as f:
              json.dump(output, f, indent=4)
          print("Updated ttrpg_leads.json successfully.")
          EOF
          python fetch_leads.py

      - name: Commit and Push Updated Leads
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ttrpg_leads.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update Multi-Platform Leads"
            git push
          fi
