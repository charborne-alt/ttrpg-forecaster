name: Daily TTRPG Lead Fetcher

on:
  schedule:
    - cron: '0 6 * * *'  # Runs automatically every day at 6:00 AM UTC
  workflow_dispatch:      # Allows manual triggers

jobs:
  fetch-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Grants permission to push updated files
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Market Leads
        run: |
          cat << 'EOF' > fetch_leads.py
          import requests
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime

          leads = []

          # 1. Fetch DriveThruRPG Best Sellers Feed
          try:
              headers = {'User-Agent': 'Mozilla/5.0'}
              r = requests.get('https://www.drivethrurpg.com/rss.php', headers=headers, timeout=10)
              if r.status_code == 200:
                  root = ET.fromstring(r.text)
                  for item in root.findall('.//item')[:10]:
                      title = item.find('title').text if item.find('title') is not None else ''
                      clean_title = title.replace('<![CDATA[', '').replace(']]>', '').strip()
                      leads.append({
                          "source": "DriveThruRPG",
                          "title": clean_title,
                          "metric": "Store Bestseller",
                          "tier": "t2",
                          "baseline_match": "Pathfinder / DCC"
                      })
          except Exception as e:
              print("DTRPG Fetch Notice:", e)

          # Fallback sample leads if external feeds are blocked
          if not leads:
              leads = [
                  { "source": "DriveThruRPG", "title": "Delta Green Cosmic Horror RPG", "metric": "Top Seller", "tier": "t1" },
                  { "source": "DriveThruRPG", "title": "Pathfinder 2e Core Rulebook", "metric": "Top Seller", "tier": "t2" },
                  { "source": "Kickstarter", "title": "Mothership 1e Sci-Fi Horror", "metric": "$1.4M Funded", "tier": "t1" }
              ]

          output = {
              "last_updated": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
              "leads": leads
          }

          with open('ttrpg_leads.json', 'w') as f:
              json.dump(output, f, indent=4)
          print("Successfully wrote ttrpg_leads.json")
          EOF
          python fetch_leads.py

      - name: Commit and Push Updated Leads
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttrpg_leads.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update TTRPG market leads"
            git push
          fi
